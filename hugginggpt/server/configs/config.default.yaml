# ── LLM Back-ends ─────────────────────────────────────────────────────────────
# Pick ONE active section. Comment out the others.

# Option A: Anthropic Claude (recommended)
anthropic:
  api_key: REPLACE_WITH_YOUR_ANTHROPIC_API_KEY_HERE   # sk-ant-…

# Option B: OpenAI
# openai:
#   api_key: REPLACE_WITH_YOUR_OPENAI_API_KEY_HERE

# Option C: Azure OpenAI
# azure:
#   api_key: REPLACE_WITH_YOUR_AZURE_API_KEY_HERE
#   base_url: REPLACE_WITH_YOUR_ENDPOINT_HERE
#   deployment_name: REPLACE_WITH_YOUR_DEPLOYMENT_NAME_HERE
#   api_version: "2022-12-01"

# ── HuggingFace ───────────────────────────────────────────────────────────────
huggingface:
  token: REPLACE_WITH_YOUR_HUGGINGFACE_TOKEN_HERE   # https://huggingface.co/settings/tokens

# ── Core settings ─────────────────────────────────────────────────────────────
dev: false
debug: false
log_file: logs/debug.log

# Model to use. For Claude: claude-sonnet-4-6 | claude-opus-4-6 | claude-haiku-4-5-20251001
# For OpenAI: gpt-4o | gpt-4 | gpt-3.5-turbo
model: claude-sonnet-4-6
use_completion: false         # false = chat completions (required for Claude + newer OpenAI)

inference_mode: hybrid        # local | huggingface | hybrid
local_deployment: full        # minimal | standard | full
device: cuda:0                # cuda:id or cpu
num_candidate_models: 5
max_description_length: 100
proxy:                        # optional: "http://ip:port"

# ── HTTP server ────────────────────────────────────────────────────────────────
http_listen:
  host: 0.0.0.0
  port: 8004

local_inference_endpoint:
  host: localhost
  port: 8005

# ── Device integrations ────────────────────────────────────────────────────────
integrations:
  phone:
    enabled: false                       # set true after running phone_bridge.py
    base_url: http://localhost:8091
    token: REPLACE_WITH_PHONE_BRIDGE_TOKEN
  computer:
    enabled: true                        # set false to disable PC automation
    base_url: http://localhost:8092
    token: REPLACE_WITH_COMPUTER_BRIDGE_TOKEN

# ── Email (used by bridge_server.py send_email / read_emails) ─────────────────
email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  imap_host: imap.gmail.com
  imap_port: 993
  username: REPLACE_WITH_YOUR_EMAIL@gmail.com
  password: REPLACE_WITH_YOUR_APP_PASSWORD   # Gmail App Password (not your login password)
  sender:                                     # leave blank to use username

# ── Voice module ───────────────────────────────────────────────────────────────
voice:
  stt_backend: google          # google | whisper
  tts_backend: auto            # auto | pyttsx3 | elevenlabs | print
  whisper_model: base          # tiny | base | small | medium | large
  elevenlabs_voice: Rachel     # only used when tts_backend = elevenlabs
  # elevenlabs_api_key: REPLACE_WITH_ELEVENLABS_KEY  (or set ELEVENLABS_API_KEY env)
logit_bias:
  parse_task: 0.1
  choose_model: 5
tprompt:
  parse_task: >-
    You are Jarvis task planner. Return only a JSON array of tasks in this exact schema: [{"task": task, "id": task_id, "dep": dependency_task_id, "args": {"text": text or <GENERATED>-dep_id, "image": image_url or <GENERATED>-dep_id, "audio": audio_url or <GENERATED>-dep_id}}]. Use only args keys from ["text","image","audio"]. "<GENERATED>-dep_id" must reference a valid dependency that actually produces that resource type. Keep the plan minimal but complete for the current request. Keep task order and dependencies correct. Allowed tasks only: "token-classification", "text2text-generation", "summarization", "translation", "question-answering", "conversational", "text-generation", "sentence-similarity", "tabular-classification", "object-detection", "image-classification", "image-to-image", "image-to-text", "text-to-image", "text-to-video", "visual-question-answering", "document-question-answering", "image-segmentation", "depth-estimation", "text-to-speech", "automatic-speech-recognition", "audio-to-audio", "audio-classification", "canny-control", "hed-control", "mlsd-control", "normal-control", "openpose-control", "canny-text-to-image", "depth-text-to-image", "hed-text-to-image", "mlsd-text-to-image", "normal-text-to-image", "openpose-text-to-image", "seg-text-to-image". For assistant-like intents (building control, system control, scheduling, diagnostics, information retrieval), choose the best available task(s), and use "conversational" when no specialized tool task applies. If not parseable, return [].
  choose_model: >-
    You are Jarvis model selector. Choose the best model for each task with this priority: (1) task-fit and expected quality, (2) endpoint availability/stability, (3) speed and latency, (4) generality if request is ambiguous. Prefer local endpoints when quality is comparable. Use the model description, tags, and likes as evidence. Return strict JSON only: {"id": "id", "reason": "short, concrete reason"}.
  response_results: >-
    #4 Response Generation Stage: You are Jarvis. Operate with these capabilities in mind: natural language communication, system and automation assistance, sensor/data interpretation, multi-system coordination, diagnostics, and information analysis. Use available execution results to provide a practical command-center style response.
demos_or_presteps:
  parse_task: demos/demo_parse_task.json
  choose_model: demos/demo_choose_model.json
  response_results: demos/demo_response_results.json 
prompt:
  parse_task: I input { {{input}} }. Plan tasks only from this current request, without using prior chat history. Pay attention to the input and output types of tasks and the dependencies between tasks.
  choose_model: >-
    Please choose the most suitable model from {{metas}} for the task {{task}}. The output must be in a strict JSON format: {"id": "id", "reason": "your detail reasons for the choice"}.
  response_results: >-
    You are Jarvis, a real-life style assistant. Give an action-first answer using only current request results. Be concise, practical, and confident. Mention only essential steps. Include complete file paths or URLs when relevant. For hardware/building/satellite actions outside connected tools, clearly state limitations and provide the exact integration or next step required. If results are insufficient, clearly say what is missing and what to try next.