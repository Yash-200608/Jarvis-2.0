name: Bug report
description: Something in JARVIS (embodiment) does not match documented or expected behavior.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cognition bugs (memory, planner, Brain API) belong in the Brain repo.
        Do not file security vulnerabilities here — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you expected vs what you got.
    validations:
      required: true
  - type: dropdown
    id: island
    attributes:
      label: Which island
      options:
        - jarvis_node_sdk (Chimera MQTT node)
        - legacy HTTP stack (hugginggpt/server bridges)
        - jarvis_prod (draft MQTT)
        - jarvis_core
        - root core/ (safety kernel)
        - docs
        - other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / Termux / …
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps. Redact tokens, HMAC keys, and app passwords.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or logs
      render: text
